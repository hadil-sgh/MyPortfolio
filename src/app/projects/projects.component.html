<section class="section" id="projects">
  <p class="eyebrow">projects</p>

  <div class="grid">
    @for (p of projects; track p.title) {
      <article
        class="card"
        (click)="openProject(p)"
        (keydown.enter)="openProject(p)"
        (keydown.space)="$event.preventDefault(); openProject(p)"
        tabindex="0"
        role="button"
        [attr.aria-label]="'View ' + p.title + ' project details'"
      >
        <div class="visual">
          @if (p.thumbnail) {
            <img
              class="project-image"
              [src]="p.thumbnail"
              [alt]="p.title + ' project thumbnail'"
            />
          } @else {
            <div class="project-image-placeholder">Preview coming soon</div>
          }
        </div>
        <div class="tags">
          @for (t of p.tags; track t) {
            <span class="tag">{{ t }}</span>
          }
        </div>
        <h3>{{ p.title }}</h3>
        <p>{{ p.description }}</p>
      </article>
    }
  </div>

  @if (selectedProject) {
    <app-project-modal
      [project]="selectedProject"
      (closed)="closeProject()"
    ></app-project-modal>
  }
</section>
